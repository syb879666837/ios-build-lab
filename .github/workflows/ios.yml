name: ios-build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: 编 arm64 iOS dylib
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 工具链信息
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)  path=$(xcrun --sdk iphoneos --show-sdk-path)"
          {
            echo "### 云端 Mac 环境"
            echo ""
            echo "- 架构: \`$(uname -m)\`"
            echo "- macOS: \`$(sw_vers -productVersion)\`"
            echo "- Xcode: \`$(xcodebuild -version | head -1)\`"
            echo "- iOS SDK: \`$(xcrun --sdk iphoneos --show-sdk-version)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 编最小 iOS dylib
        run: |
          mkdir -p out
          printf 'int minis_answer(void){return 42;}\n' > out/hello.c
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -O2 \
            -miphoneos-version-min=16.0 \
            -install_name @rpath/libhello.dylib \
            out/hello.c -o out/libhello.dylib
          file out/libhello.dylib
          lipo -info out/libhello.dylib
          xcrun --sdk iphoneos nm -gU out/libhello.dylib | head -3

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: libhello-arm64
          path: out/libhello.dylib
          if-no-files-found: error
