name: ios-build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  # 先摸清这个账号能用哪个 macOS runner（arm64 配置本账号不支持）
  probe:
    name: 探测 runner ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-latest, macos-15]
    steps:
      - name: 机器信息
        run: |
          sw_vers
          uname -m
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true
